# ARC - Artifact Reality Composer Configuration
# ==============================================

# ---------------------------------------------------------------------------
# Target Mode (choose ONE — see docs/recovery_guide.md for safety details)
# ---------------------------------------------------------------------------
#
# ✅ SAFE — VM disk image (recommended for testing):
#   Run:  python main.py --image /path/to/windows11.img
#   Or:   python main.py --image disk.img --image-partition 3
#
# ⚠️  ADVANCED — Dual-boot physical partition:
#   REQUIRES Windows to be FULLY shut down (NOT hibernated/Fast Startup).
#   Run:  python main.py --partition /dev/nvme0n1p3 --force-partition
#   Never set windows_partition here for a dual-boot system — use the
#   CLI flags so you must consciously specify the device each time.
#
# ❌ NEVER DO:
#   - Set windows_partition to your real dual-boot partition in this file
#   - Run ARC without --dry-run while Windows is in Fast Startup/hibernate
#   - Use ntfsfix -d manually to "fix" a hibernated partition
#
# Leave both commented to use safe output-directory mode (no partition).
# windows_partition: ""     # e.g. /dev/nvme0n1p3 — set only for one-off VMs
# windows_mount_point: "/mnt/arc_windows"

# Safety guard — set to true to allow physical drive access (still requires
# --force-partition CLI flag AND interactive confirmation at runtime).
require_explicit_partition: true

# Output directory for generated artifacts (used when no image/partition given)
mount_path: "./output"

# Profile configuration
profiles_dir: "profiles/presets"
profile_name: "home_user"

# Data directory (contains hardware_models.json, wordlists, etc.)
data_dir: "data"

# Timeline configuration
timeline_days: 360

# Audit log path
audit_log_path: "audit.log"

# Error handling
abort_on_failure: false

# ---------------------------------------------------------------------------
# AI-Powered Profile Generation (Gemini)
# ---------------------------------------------------------------------------
ai:
  # Enable/disable AI generation (falls back to static profiles if disabled)
  enabled: true
  
  # Provider configuration
  provider: "gemini"
  
  gemini:
    # API key (use environment variable for security)
    # Set GEMINI_API_KEY environment variable or uncomment below
    # api_key: "your-api-key-here"
    
    # Model selection
    # Example: gemini-3.1-flash-lite-preview (fast/cheap)
    model: "gemini-3.1-flash-lite-preview"
    
    # Generation temperature (0.0 = deterministic, 1.0 = creative)
    temperature: 0.7
    
    # Rate limiting (requests per minute)
    rate_limit_rpm: 60
    
    # Retry configuration
    max_retries: 3
  
  # Response caching (reduces API costs, enables reproducibility)
  cache:
    enabled: true
    directory: ".cache/gemini"
    ttl_hours: 168  # 1 week
  
  # No fallback — AI generation is mandatory
  fallback:
    enabled: false

# ---------------------------------------------------------------------------
# Artifact Scale — per-day rates (ADR-013)
# target_count = per_day × persona.timeline_days × (1 + rng.uniform(-jitter, +jitter))
# ---------------------------------------------------------------------------
artifact_scale:
  downloads:
    per_day: 4.2
    jitter: 0.3

  documents:
    per_day: 12.5
    jitter: 0.3

  pictures:
    per_day: 2.1
    jitter: 0.4

  videos:
    per_day: 0.67
    jitter: 0.4

  music:
    per_day: 1.4
    jitter: 0.3

  browser_history:
    per_day: 83.0
    jitter: 0.5

  search_terms:
    per_day: 16.7
    jitter: 0.5

  bookmarks:
    per_day: 0.56
    jitter: 0.2

# ---------------------------------------------------------------------------
# Permutation Engine Configuration
# ---------------------------------------------------------------------------
permutation:
  # Version number settings
  versions:
    max_version: 5
    styles: ["v{n}", "V{n}", "_{n}"]

  # Common filename suffixes
  suffixes: ["", "_DRAFT", "_Final", "_reviewed", "_backup", "_old"]

  # Date format patterns for filenames
  date_formats:
    - "%Y%m%d"
    - "%Y-%m-%d"
    - "%B_%d_%Y"
    - "%d%b%Y"
