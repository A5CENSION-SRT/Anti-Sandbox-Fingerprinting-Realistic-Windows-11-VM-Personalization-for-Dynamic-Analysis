version: '3.8'

services:
  arc:
    build:
      context: .
      dockerfile: Dockerfile
    image: arc:latest
    container_name: arc-personalization
    
    # Required for libguestfs and FUSE operations
    privileged: true
    
    # Capabilities for FUSE mounting
    cap_add:
      - SYS_ADMIN
      - MKNOD
    
    # Devices for KVM (if available)
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/fuse:/dev/fuse
    
    # Volumes
    volumes:
      # Mount directory containing VHDX files
      - ./vhdx:/vhdx:rw
      
      # Mount directory for output
      - ./output:/output:rw
      
      # Mount custom profiles (optional)
      - ./profiles:/app/profiles:ro
      
      # Mount config (optional)
      - ./config.yaml:/app/config.yaml:ro
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ARC_LOG_LEVEL=${ARC_LOG_LEVEL:-INFO}
    
    # Working directory
    working_dir: /app
    
    # Default command (override with docker-compose run)
    command: ["--help"]
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

# Usage examples:
#
# 1. Build the image:
#    docker-compose build
#
# 2. Run ARC with office_user profile:
#    docker-compose run --rm arc --vhdx /vhdx/baseline.vhdx --profile office_user
#
# 3. Run with custom profile:
#    docker-compose run --rm arc --vhdx /vhdx/baseline.vhdx --profile-file /app/profiles/custom.yaml
#
# 4. Interactive shell:
#    docker-compose run --rm arc /bin/bash
#
# 5. Run tests:
#    docker-compose run --rm arc bash -c "cd /app && pytest tests/ -v"
#
# 6. Validate baseline:
#    docker-compose run --rm arc bash -c "bash /app/scripts/validate_baseline.sh /vhdx/baseline.vhdx"
